name: Release
on:
  push:
    tags: ['v*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "release tag/version mismatch: tag is \"$GITHUB_REF_NAME\" but package.json version is \"$version\" (expected tag \"v$version\")" >&2
            exit 1
          fi
      - run: npm run build
      - name: Package
        shell: bash
        run: node scripts/package-release.mjs
      - name: Checksums
        shell: bash
        run: |
          cd release
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
